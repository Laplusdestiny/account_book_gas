    <style>

        .ai-btn { width: 100%; }
        .ai-result-box { padding: 10px; font-size: 0.9em; }

  </head>
  <body>
    <div class="container">

      <div class="header-top">
        <h1>家計簿レポート</h1>
        <a href="<?= baseUrl ?>?page=annual" class="nav-btn">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 5px;">
            <path d="M4 .5a.5.5 0 0 0-1 0V1H2a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-1V.5a.5.5 0 0 0-1 0V1H4V.5zM1 4h14v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4z"/>
          </svg>
          年間レポート
        </a>
        <a href="<?= formUrl ?>" target="_blank" class="form-btn">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 5px;">
            <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
            <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z"/>
          </svg>
          入力フォーム
        </a>
      </div>

      <div id="loading" class="loading">データを読み込んでいます...</div>

      <div id="report-content" style="display: none;">

        <div class="header-controls">
          <div class="filter-group">
            <label for="month-select">表示月:</label>
            <select id="month-select" onchange="updateReport()"></select>
          </div>
          <div class="filter-group">
            <label for="payment-select">支払い方法:</label>
            <select id="payment-select" onchange="updateReport()">
              <option value="all">すべて</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="payer-select">支払い者:</label>
            <select id="payer-select" onchange="updateReport()">
              <option value="all">すべて</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="user-select">利用者:</label>
            <select id="user-select" onchange="updateReport()">
              <option value="all">すべて</option>
            </select>
          </div>
        </div>

        <div class="summary-cards">
          <div class="summary-box">
            <h3>収入</h3>
            <div id="total-income" class="amount-income">¥0</div>
          </div>
          <div class="summary-box">
            <h3>支出</h3>
            <div id="total-expense" class="amount-expense">¥0</div>
          </div>
          <div class="summary-box" style="border: 2px solid #3498db;">
            <h3>収支（残高）</h3>
            <div id="total-balance" class="amount-balance">¥0</div>
          </div>
        </div>

        <div class="charts-container">
          <div class="chart-box">
            <h3>費目別</h3>
            <div class="canvas-container"><canvas id="categoryChart"></canvas></div>
          </div>
          <div class="chart-box">
            <h3>支払い方法</h3>
            <div class="canvas-container"><canvas id="paymentChart"></canvas></div>
          </div>
          <div class="chart-box">
            <h3>支払い者</h3>
            <div class="canvas-container"><canvas id="payerChart"></canvas></div>
          </div>
          <div class="chart-box">
            <h3>利用者</h3>
            <div class="canvas-container"><canvas id="userChart"></canvas></div>
          </div>
        </div>

        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
          <div class="card" style="flex: 1; min-width: 250px;">
            <h2>費目別 詳細</h2>
            <table id="category-table"><tbody></tbody></table>
          </div>
          <div class="card" style="flex: 1; min-width: 250px;">
            <h2>決済・人物別 詳細</h2>
            <h3 style="font-size:1em; margin-bottom:5px;">支払い方法</h3>
            <table id="payment-table" style="margin-bottom: 15px;"><tbody></tbody></table>
            <h3 style="font-size:1em; margin-bottom:5px;">支払い者</h3>
            <table id="payer-table" style="margin-bottom: 15px;"><tbody></tbody></table>
            <h3 style="font-size:1em; margin-bottom:5px;">利用者</h3>
            <table id="user-table"><tbody></tbody></table>
          </div>
        </div>

        <div class="card">
          <h2>利用明細</h2>
          <div class="history-table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>日付</th>
                  <th>区分/費目</th>
                  <th>内容</th>
                  <th>決済・人物</th>
                  <th class="text-right">金額</th>
                </tr>
              </thead>
              <tbody id="history-table"></tbody>
            </table>
          </div>
        </div>

        <div class="card ai-card">
          <div class="ai-header">
            <h2>✨ AI家計アドバイザー <span style="font-size:0.7em; color:#7f8c8d; font-weight:normal;">(Gemini 3.8 Flash)</span></h2>
            <button id="ai-analyze-btn" class="ai-btn" onclick="runAiAnalysis()">
              表示中の月をAI分析する
            </button>
          </div>
          <div id="ai-advice-result" class="ai-result-box"></div>
        </div>
      </div>
    </div>

    <script>
      let allData = [];
      let chartInstances = { category: null, payment: null, payer: null, user: null };

      window.onload = function() {
        google.script.run
          .withSuccessHandler(initializeData)
          .withFailureHandler(function(err) {
            document.getElementById('loading').innerText =
              'データの読み込みに失敗しました: ' + (err && err.message ? err.message : err);
          })
          .getReportData();
      };

      function initializeData(data) {
        allData = data;

        const months = [...new Set(allData.map(d => d['年月']))].filter(m => m !== '不明').sort().reverse();
        const monthSelect = document.getElementById('month-select');
        months.forEach(month => {
          let option = document.createElement('option');
          option.value = month;
          option.text = month.replace('-', '年') + '月';
          monthSelect.appendChild(option);
        });

        const payments = [...new Set(allData.map(d => d['支払い方法']))]
          .filter(p => p && p.trim() !== '' && p !== '収入').sort();
        const paymentSelect = document.getElementById('payment-select');
        payments.forEach(pay => { paymentSelect.appendChild(new Option(pay, pay)); });

        const payers = [...new Set(allData.map(d => d['支払い者'] || d['使用者']))]
          .filter(p => p && p.trim() !== '' && p !== '収入').sort();
        const payerSelect = document.getElementById('payer-select');
        payers.forEach(payer => { payerSelect.appendChild(new Option(payer, payer)); });

        const users = [...new Set(allData.map(d => d['利用者'] || d['使用者']))]
          .filter(u => u && u.trim() !== '' && u !== '収入').sort();
        const userSelect = document.getElementById('user-select');
        users.forEach(user => { userSelect.appendChild(new Option(user, user)); });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('report-content').style.display = 'block';

        if (months.length > 0) { updateReport(); }
      }

      function updateReport() {
        const selectedMonth = document.getElementById('month-select').value;
        const selectedPay = document.getElementById('payment-select').value;
        const selectedPayer = document.getElementById('payer-select').value;
        const selectedUser = document.getElementById('user-select').value;

        let targetData = allData.filter(d => d['年月'] === selectedMonth);

        if (selectedPay !== 'all') {
          targetData = targetData.filter(d => d['支払い方法'] === selectedPay);
        }
        if (selectedPayer !== 'all') {
          targetData = targetData.filter(d => (d['支払い者'] || d['使用者']) === selectedPayer);
        }
        if (selectedUser !== 'all') {
          targetData = targetData.filter(d => (d['利用者'] || d['使用者']) === selectedUser);
        }

        let totalIncome = 0;
        let totalExpense = 0;
        let categories = {};
        let payments = {};
        let payers = {};
        let users = {};

        targetData.forEach(row => {
          let amount = toAmount(row['金額']);

          if (isIncome(row)) {
            totalIncome += amount;
          } else {
            totalExpense += amount;

            let cat = row['費目'] || 'その他';
            categories[cat] = (categories[cat] || 0) + amount;

            let pay = row['支払い方法'] || '不明';
            if (pay !== '収入') payments[pay] = (payments[pay] || 0) + amount;

            let payer = row['支払い者'] || row['使用者'] || '不明';
            if (payer !== '収入') payers[payer] = (payers[payer] || 0) + amount;

            let user = row['利用者'] || row['使用者'] || '不明';
            if (user !== '収入') users[user] = (users[user] || 0) + amount;
          }
        });

        let balance = totalIncome - totalExpense;
        document.getElementById('total-income').innerText = '¥' + totalIncome.toLocaleString();
        document.getElementById('total-expense').innerText = '¥' + totalExpense.toLocaleString();

        let balanceEl = document.getElementById('total-balance');
        balanceEl.innerText = (balance >= 0 ? '+' : '') + '¥' + balance.toLocaleString();
        balanceEl.style.color = balance >= 0 ? '#2980b9' : '#e74c3c';

        renderTable('category-table', categories);
        renderTable('payment-table', payments);
        renderTable('payer-table', payers);
        renderTable('user-table', users);

        drawChart('categoryChart', categories, 'category', chartInstances);
        drawChart('paymentChart', payments, 'payment', chartInstances);
        drawChart('payerChart', payers, 'payer', chartInstances);
        drawChart('userChart', users, 'user', chartInstances);

        targetData.sort((a, b) => new Date(b['日付']) - new Date(a['日付']));
        const historyTbody = document.getElementById('history-table');
        historyTbody.innerHTML = '';

        if(targetData.length === 0){
           historyTbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">該当するデータがありません</td></tr>';
        }

        targetData.forEach(row => {
          let income = isIncome(row);

          let tr = document.createElement('tr');
          if (income) tr.className = 'row-income';

          let typeStr = row['収支'] || row['収支区分'] ? `[${row['収支'] || row['収支区分']}]<br>${row['費目']}` : row['費目'];
          let dispPayer = row['支払い者'] || row['使用者'] || '-';
          let dispUser = row['利用者'] || row['使用者'] || '-';

          // 「内容・詳細」列には col-detail クラスを付与
          tr.innerHTML = `
            <td>${row['表示用日付']}</td>
            <td><span style="font-size:0.9em;">${typeStr}</span></td>
            <td class="col-detail">${row['内容・詳細'] || ''}</td>
            <td><span style="font-size:0.8em; color:#666;">決: ${row['支払い方法'] || '-'}<br>払: ${dispPayer}<br>用: ${dispUser}</span></td>
            <td class="text-right" style="${income ? 'color:#27ae60; font-weight:bold;' : ''}">
              ${income ? '+' : ''}¥${toAmount(row['金額']).toLocaleString()}
            </td>
          `;
          historyTbody.appendChild(tr);
        });
      }

      // 収入判定と金額変換を画面表示と完全に一致させるため、AIに渡す集計もサーバーではなくここで isIncome / toAmount を使って行う
      function summarizeMonthForAi(ym) {
        const summary = { income: 0, expense: 0, categories: {}, payers: {}, users: {}, details: [] };

        allData.filter(d => d['年月'] === ym).forEach(row => {
          const amount = toAmount(row['金額']);
          if (isIncome(row)) {
            summary.income += amount;
            return;
          }
          summary.expense += amount;

          const cat = row['費目'] || 'その他';
          summary.categories[cat] = (summary.categories[cat] || 0) + amount;

          const payer = row['支払い者'] || row['使用者'] || '不明';
          if (payer !== '収入') summary.payers[payer] = (summary.payers[payer] || 0) + amount;

          const user = row['利用者'] || row['使用者'] || '不明';
          if (user !== '収入') summary.users[user] = (summary.users[user] || 0) + amount;

          if (amount >= 2000) {
            summary.details.push({ date: row['表示用日付'], category: cat, content: row['内容・詳細'] || '', amount, payer, user });
          }
        });

        summary.details = summary.details.sort((a, b) => b.amount - a.amount).slice(0, 25);
        return summary;
      }

      function runAiAnalysis() {
        const selectedMonth = document.getElementById('month-select').value;
        const btn = document.getElementById('ai-analyze-btn');
        const resultBox = document.getElementById('ai-advice-result');

        if (!selectedMonth) return;

        const [year, month] = selectedMonth.split('-').map(Number);
        const prevDate = new Date(year, month - 2, 1);
        const prevMonth = `${prevDate.getFullYear()}-${('0' + (prevDate.getMonth() + 1)).slice(-2)}`;

        btn.disabled = true;
        btn.innerText = '🤖 Geminiが分析中... (約10〜15秒)';
        resultBox.style.display = 'block';
        resultBox.innerText = `${selectedMonth.replace('-', '年')}月の実績と前月比データを集計し、改善案を作成しています...`;

        google.script.run
          .withSuccessHandler(function(adviceMarkdown) {
            btn.disabled = false;
            btn.innerText = '🔄 もう一度分析する';
            // CDNの読み込みに失敗していても結果は読めるよう、ライブラリが無ければプレーンテキストで出す
            if (window.marked && window.DOMPurify) {
              // AIの出力は信頼できない文字列なので、HTML化したあと必ずサニタイズしてから挿入する
              resultBox.innerHTML = DOMPurify.sanitize(marked.parse(adviceMarkdown, { breaks: true }));
            } else {
              resultBox.innerText = adviceMarkdown;
            }
          })
          .withFailureHandler(function(err) {
            resultBox.innerText = 'エラーが発生しました:\n' + err.message;
            btn.disabled = false;
            btn.innerText = '表示中の月をAI分析する';
          })
          .generateMonthlyAiAdvice({
            month: selectedMonth,
            prevMonth: prevMonth,
            current: summarizeMonthForAi(selectedMonth),
            prev: summarizeMonthForAi(prevMonth)
          });
      }
    </script>
  </body>
</html>
